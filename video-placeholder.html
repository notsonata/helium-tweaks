<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Video is fullscreen</title>
    <link rel="stylesheet" href="video-placeholder.css">
  </head>
  <body>
    <button class="restore" id="restore" type="button">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M8 5H5v3M16 5h3v3M8 19H5v-3M16 19h3v-3"
          stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="m9 12 3 3 3-3M12 15V7"
          stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="title">Click here to exit fullscreen</span>
      <span class="copy">The video tab is playing in a separate macOS Space.</span>
    </button>
    <script src="video-placeholder.js"></script>
  </body>
</html>
